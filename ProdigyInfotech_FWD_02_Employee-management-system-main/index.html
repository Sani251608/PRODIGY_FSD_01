<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>CRUD Operation</title>
  
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet"/>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"/>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/animate.css/4.1.1/animate.min.css"/>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/js/bootstrap.bundle.min.js"></script>
  <script src="https://unpkg.com/sweetalert/dist/sweetalert.min.js"></script>

  <style>
    body {
      background-color: #f8f9fa;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }
    h1 {
      color: #3f3d56;
    }
    .header-bar {
      background-color: #4b6584;
    }
    .header-bar h1 {
      margin: 0;
      font-size: 24px;
    }
    .btn-custom {
      border-radius: 0.4rem;
    }
    .btn-add {
      background-color: #20c997;
      color: white;
    }
    .btn-add:hover {
      background-color: #17a589;
    }
    .btn-delete-all {
      background-color: #eb4d4b;
      color: white;
    }
    .btn-delete-all:hover {
      background-color: #c0392b;
    }
    .btn-update {
      background-color: #6c5ce7;
      color: white;
    }
    .btn-update:hover {
      background-color: #4834d4;
    }
    .btn-submit {
      background-color: #0984e3;
      color: white;
    }
    .btn-submit:hover {
      background-color: #007bb5;
    }
    .modal-header {
      background-color: #4b6584;
    }
    .modal-header h4 {
      color: white;
    }
    .form-control:focus {
      box-shadow: 0 0 0 0.2rem rgba(32, 201, 151, 0.25);
    }
  </style>
</head>
<body>

  <div class="container mt-4">
    <h1 class="text-center fw-bold p-4">CRUD Operation</h1>
    
    <div class="bg-white shadow p-4">
      <div class="d-flex justify-content-between align-items-center header-bar p-3 mb-3 text-white rounded">
        <h1 class="fw-bold">Employee Details</h1>
        <div class="d-flex gap-2">
          <input type="search" placeholder="Search" class="form-control" id="search"/>
          <button class="btn btn-delete-all btn-custom" id="delete-all">
            <i class="fa fa-minus"></i> Delete All
          </button>
          <button class="btn btn-add btn-custom" data-bs-toggle="modal" data-bs-target="#myModal">
            <i class="fa fa-plus"></i> Add New User
          </button>
        </div>
      </div>

      <div class="table-responsive">
        <table class="table table-striped text-center align-middle">
          <thead class="table-dark">
            <tr>
              <th>Sr</th>
              <th>Profile</th>
              <th>Name</th>
              <th>Email</th>
              <th>Mobile</th>
              <th>DOB</th>
              <th>Action</th>
            </tr>
          </thead>
          <tbody class="reg-list" id="regList">
            <!-- Rows go here -->
          </tbody>
        </table>
      </div>
    </div>
  </div>

  <!-- Modal -->
  <div class="modal fade animate__animated animate__zoomIn" id="myModal" tabindex="-1">
    <div class="modal-dialog modal-dialog-centered modal-lg">
      <div class="modal-content">
        <div class="modal-header">
          <h4 class="modal-title fw-bold">Add New User</h4>
          <button class="btn-close bg-white" data-bs-dismiss="modal"></button>
        </div>
        <div class="modal-body">
          <form id="registerForm">
            <div class="input-group mb-3">
              <span class="input-group-text">Name</span>
              <input type="text" required class="form-control" id="name"/>
            </div>
            <div class="input-group mb-3">
              <span class="input-group-text">Email</span>
              <input type="email" required class="form-control" id="email"/>
            </div>
            <div class="input-group mb-3">
              <span class="input-group-text">Mobile</span>
              <input type="number" required class="form-control" id="mobile"/>
            </div>
            <div class="input-group mb-3">
              <span class="input-group-text">DOB</span>
              <input type="date" required class="form-control" id="dob"/>
            </div>
            <div class="input-group mb-3">
              <span class="input-group-text">Password</span>
              <input type="password" required class="form-control" id="password"/>
            </div>
            <div class="input-group mb-3">
              <input type="file" class="form-control" id="profile"/>
            </div>
            <div class="d-flex justify-content-end gap-2">
              <button class="btn btn-update btn-custom" type="button" id="updateBtn" disabled>Update</button>
              <button class="btn btn-submit btn-custom" type="submit" id="submitBtn">Submit</button>
            </div>
          </form>
        </div>
      </div>
    </div>
  </div>

  <script src="js/index.js"></script>
</body>
</html>
